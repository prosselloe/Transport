name: transport
description: "Transport Balears"
publish_to: 'none'
version: 1.0.0+14

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.0
  provider: ^6.0.0
  go_router: ^17.0.0
  http: ^1.0.0
  google_maps_flutter: ^2.0.0
  google_fonts: ^8.0.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.0.0
  flutter_native_splash: ^2.0.0
  flexible_polyline_dart: ^1.0.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  mallorca_transit_services: ^1.2.1
  polyline_codec: ^0.1.6
  package_info_plus: ^9.0.0
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo.png
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - README.md
